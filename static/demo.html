<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>ResumeFill 测试表单</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>插件测试表单</h1><p>导入插件资料后，点击插件“一键填写当前页”。此页面不会发送任何表单。</p><section><form><div class="grid">
<label>姓名<input name="full_name" autocomplete="name"></label><label>Email<input type="email" name="email"></label><label>手机号码<input name="mobile" type="tel"></label><label>现居城市<input name="city"></label><label>毕业院校<input name="university"></label><label>专业<input name="major"></label><label>学历<select name="degree"><option value="">请选择</option><option>本科</option><option>硕士</option><option>博士</option></select></label><label>GitHub<input name="github"></label><label>意向职位<input name="desired_position"></label><label>已有内容（应保留）<input name="address" value="手动填写的地址"></label><label class="wide">自我评价<textarea name="summary"></textarea></label><label class="wide">技术技能<textarea name="skills"></textarea></label><label>奇怪字段（测试手动指定）<input name="mystery_829"></label><label>验证码（应跳过）<input name="verification_code"></label></div></form></section><p>测试手动指定：在插件中选择字段，点击“选择网页输入框”，然后点击“奇怪字段”。之后一键填写会记住这个对应关系。</p></main></body></html>
